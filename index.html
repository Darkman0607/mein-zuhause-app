 10%,white);border:2px solid color-mix(in srgb,var(--room) 60%,white);border-radius:17px;padding:14px;text-align:left;color:#203149;min-height:130px}.room .ball{width:13px;height:13px;background:var(--room);display:inline-block;border-radius:50%}.room h3{margin:10px 0 5px}.pill{display:inline-block;font-size:11px;font-weight:650;border-radius:9px;padding:4px 8px;background:#eaf0f7;color:#37506b}.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #edf0f5}.task:last-child{border-bottom:0}.task input{width:21px;height:21px;accent-color:#228768;flex:none}.task .label{flex:1;min-width:0}.task.done .label{text-decoration:line-through;color:#8b95a2}.task button{border:0;background:none;color:#a33f4c;padding:4px}.hidden{display:none!important}.empty{background:#f4f7fb;text-align:center;border-radius:13px;padding:22px;color:#667b92}.color-choice{width:31px;height:31px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c2cfda;margin:5px}.color-choice.selected{box-shadow:0 0 0 3px #203149}.room-head{border-left:7px solid var(--room);padding-left:13px}.subtabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.subtabs button{border:1px solid #d9e1eb;background:#f4f7fa;border-radius:11px;padding:9px 12px;white-space:nowrap}.subtabs button.active{background:#204c7d;color:white}.guide{border:1px solid #dbe5ef;border-radius:14px;padding:13px;margin:10px 0}.guide summary{cursor:pointer;font-weight:700}.guide ol{padding-left:21px;line-height:1.65}.guide li{padding:3px 0}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{border:1px dashed #b9c8d7;border-radius:15px;min-height:155px;overflow:hidden;position:relative;background:#f5f8fb}.photo img{width:100%;height:180px;object-fit:cover}.photo .placeholder{display:grid;place-items:center;gap:4px;padding:24px 5px;color:#688095;text-align:center}.photo input{width:100%;font-size:11px;padding:7px}.tip{border-left:4px solid #3982c2;background:#edf5fd;paddin /* V1.4: Pastell-Themen, Grundriss, Türen und Fenster */
:root{--app-bg:#fff1f6;--app-surface:#fffaff;--app-accent:#aa507b}
body{background:var(--app-bg)}.box{background:var(--app-surface)}.topbar{background:var(--app-surface)}
.tab.active{background:color-mix(in srgb,var(--app-accent) 13%,white);color:var(--app-accent)}
.primary{background:var(--app-accent);border-color:var(--app-accent)}
.floorplan{width:100%;aspect-ratio:1.08;position:relative;border:2px solid #afbdd0;border-radius:16px;overflow:hidden;background-color:#fbfcff;background-image:linear-gradient(#dfe6ef 1px,transparent 1px),linear-gradient(90deg,#dfe6ef 1px,transparent 1px);background-size:5% 5%;touch-action:none;user-select:none}
.floor-room{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px;border:3px solid var(--room);border-radius:6px;background:color-mix(in srgb,var(--room) 23%,white);color:#1d2d43;text-align:center;overflow:hidden;touch-action:none;font-size:clamp(10px,2.7vw,14px);font-weight:750}
.floor-room small{font-size:10px;font-weight:500}.floorplan.editing .floor-room{cursor:grab;box-shadow:0 2px 6px #243d5c30}.floorplan.editing .floor-room.selected{outline:3px solid #223f6d;outline-offset:1px;z-index:2}
.floor-handle{position:absolute;right:0;bottom:0;width:25px;height:25px;border-radius:8px 0 0 0;background:#263d5c;color:white;display:grid;place-items:center;cursor:nwse-resize;font-size:15px;touch-action:none}
.theme-swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.theme-swatch{border:2px solid #d9dfe8;background:var(--swatch);min-height:65px;border-radius:13px;padding:7px;font-weight:650;color:#28394d}.theme-swatch.active{border-color:#253d65;box-shadow:0 0 0 2px #96a8c6}
.floor-help{font-size:12px;color:#586d86;margin:9px 0}.floor-tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* Tür-/Fenstermarker entlang einer Raumwand */
.opening{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;box-sizing:border-box;border-radius:3px;overflow:visible}
.opening.door{background:#ffffff;border:2px solid #965a32;color:#744020}
.opening.window{background:#a6e5ff;border:2px solid #2478ac;color:#13567a}
.opening.horizontal{width:28%;height:11px;transform:translate(-50%,-50%)}
.opening.vertical{width:11px;height:28%;transform:translate(-50%,-50%)}
.opening .opening-symbol{font-size:11px;position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:white;border-radius:4px;padding:0 2px;pointer-events:none}
.opening.vertical .opening-symbol{left:14px;top:50%;transform:translateY(-50%)}
.opening.selected{outline:3px solid #222e54;outline-offset:2px}
.opening-editor{padding:13px;border-radius:12px;background:#f5f3fb;border:1px solid #ded5ec;margin:12px 0}
.opening-editor .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.opening-editor label{font-size:13px;font-weight:650}
.opening-editor .field{margin:5px 0 9px}
.opening-note{font-size:12px;color:#576d83}

<header><div class="in"><small style="letter-spacing:1.2px;color:#c0d5e8">DEIN PERSÖNLICHER HAUSHALTSASSISTENT</small><h1>🏠 Mein Zuhause</h1><div style="opacity:.85;font-size:14px">Putz & Ordnung – Schritt für Schritt</div></div></header><nav class="topbar" aria-label="Hauptbereiche"><div class="tabs" id="tabs"></div></nav><div id="error"></div><main class="wrap"><section id="content"></section><footer>Android Version 1 · HTML-Test · Die Daten bleiben in diesem Browser. Bitte regelmäßig sichern.</footer></main>
<dialog id="roomDialog"><h2>Raum hinzufügen</h2><form id="roomForm"><label>Raumname<input class="field" id="roomName" maxlength="45" required placeholder="z. B. Vorraum"></label><label>Raumfarbe</label><div id="palette"></div><div class="actions" style="margin-top:15px"><button class="primary">Speichern</button><button class="secondary" type="button" onclick="document.getElementById('roomDialog').close()">Abbrechen</button></div></form></dialog>
<script>
(()=>{'use strict';const KEY='mein-zuhause-putz-ordnung-v1';const EXTRA='mein-zuhause-putz-ordnung-v1-1';const PALETTE=['#F59E0B','#3B82F6','#A855F7','#10B981','#EC4899','#EF4444','#06B6D4','#84CC16','#6366F1','#F97316'];const original=[{name:'Küche',tasks:['Müll entfernen','Arbeitsflächen freiräumen','Geschirr abwaschen oder einräumen','Arbeitsflächen reinigen']},{name:'Bad',tasks:['Gegenstände aufräumen','Waschbecken reinigen','Spiegel reinigen']},{name:'WC',tasks:['WC reinigen','Oberflächen abwischen','Boden reinigen']},{name:'Wohnzimmer',tasks:['Herumliegende Sachen wegräumen','Staub entfernen','Boden saugen']},{name:'Schlafzimmer',tasks:['Kleidung einsortieren','Wäsche sammeln','Boden saugen']}];let data,extra;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!data||!Array.isArray(data.rooms)){data={rooms:original.map((r,i)=>({id:'r'+i,name:r.name,color:PALETTE[i],tasks:r.tasks.map((name,j)=>({id:'t'+i+'-'+j,name,done:false}))}))}}try{extra=JSON.parse(localStorage.getItem(EXTRA)||'null')}catch{}if(!extra||typeof extra!=='object')extra={};if(!extra.photos)extra.photos={};if(!Array.isArray(extra.stock))extra.stock=[];if(!Array.isArray(extra.shopping))extra.shopping=[];if(!extra.floorplan||typeof extra.floorplan!=='object')extra.floorplan={};if(!extra.theme)extra.theme='rosa';if(!Array.isArray(extra.openings))extra.openings=[];let planEditing=false,selectedFloor=null,ignoreFloorClick=false,selectedOpening=null;let page='overview',roomId=null,roomTab='tasks',chosenColor=PALETTE[5];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));const tabs=[['overview','Übersicht','dashboard'],['today','Heute','check'],['rooms','Räume','home'],['guide','Putzschule','book'],['photos','Fotos','camera'],['reminders','Erinnerung','bell'],['stock','Lager','package'],['shopping','Einkauf','cart'],['settings','Daten','gear']];function icon(name){return `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><use href="#i-${name}"></use></svg>`}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(EXTRA,JSON.stringify(extra));$('error').style.display='none';return true}catch(e){$('error').style.display='block';$('error').textContent='Speichern fehlgeschlagen! Erstelle eine Datensicherung oder prüfe den verfügbaren Browserspeicher.';return false}}function tasks(){return data.rooms.flatMap(r=>r.tasks.map(t=>({...t,room:r.name,roomId:r.id,color:r.color})))}function progress(n,d,color){return `<div class="progress"><span style="width:${d?Math.round(100*n/d):0}%;${color?'background:'+color:''}"></span></div>`}function navigate(to,id){page=to;if(id)roomId=id;render();window.scrollTo(0,0)}function nav(){ $('tabs').innerHTML=tabs.map(([id,name,ic])=>`<button data-nav="${id}" class="tab ${page===id||(page==='detail'&&id==='rooms')?'active':''}">${icon(ic)}<span>${name}</span></button>`).join('')}
function taskHtml(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" data-task="${esc(t.id)}" data-owner="${esc(t.roomId)}" aria-label="${esc(t.name)}" ${t.done?'checked':''}><span class="label">${esc(t.name)}</span>${page==='today'?`<span class="pill" style="border-left:4px solid ${t.color}">${esc(t.room)}</span>`:''}${page==='detail'?`<button data-del-task="${esc(t.id)}" aria-label="Aufgabe löschen">✕</button>`:''}</div>`}

 const THEMES={rosa:{name:'Rosa',bg:'#fff1f6',surface:'#fffafd',accent:'#ac4e7c'},lavendel:{name:'Lavendel',bg:'#f4efff',surface:'#fcfaff',accent:'#7457ad'},mint:{name:'Mint',bg:'#ebfaf4',surface:'#fafffc',accent:'#237d69'},himmel:{name:'Hellblau',bg:'#eef7ff',surface:'#fcfeff',accent:'#316b9a'},creme:{name:'Creme',bg:'#fff9e9',surface:'#fffefa',accent:'#9b7440'},neutral:{name:'Hellgrau',bg:'#f4f7fb',surface:'#fff',accent:'#1c548e'}};
 function applyTheme(){const t=THEMES[extra.theme]||THEMES.rosa;document.documentElement.style.setProperty('--app-bg',t.bg);document.documentElement.style.setProperty('--app-surface',t.surface);document.documentElement.style.setProperty('--app-accent',t.accent);document.querySelector('meta[name="theme-color"]').content=t.bg}
 function getFloor(r,i){const stored=extra.floorplan[r.id];if(stored&&['x','y','w','h'].every(k=>Number.isFinite(Number(stored[k]))))return stored;return {x:4+(i%2)*48,y:4+Math.floor(i/2)*22,w:44,h:19}}
  function openingHtml(o){const vertical=o.wall==='left'||o.wall==='right';const position=Math.max(12,Math.min(88,Number(o.pos)||50));const style=o.wall==='top'?`left:${position}%;top:0`:o.wall==='bottom'?`left:${position}%;top:100%`:o.wall==='left'?`left:0;top:${position}%`:`left:100%;top:${position}%`;return `<span role="button" tabindex="0" aria-label="${o.type==='door'?'Tür':'Fenster'} bearbeiten" title="${o.type==='door'?'Tür':'Fenster'} · antippen" class="opening ${o.type} ${vertical?'vertical':'horizontal'} ${selectedOpening===o.id?'selected':''}" data-opening="${esc(o.id)}" style="${style}"><span class="opening-symbol">${o.type==='door'?'🚪':'▣'}</span></span>`}
  function openingEditorHtml(){if(!planEditing)return '';let chosen=extra.openings.find(o=>o.id===selectedOpening);return `<div class="opening-editor"><h3>🚪 Türen & Fenster einsetzen</h3><p class="opening-note">Raum, Element und Wand auswählen. Position auf der Wand einstellen. Du kannst ein eingefügtes Element antippen, bearbeiten und entlang seiner Wand ziehen.</p><form id="openingForm"><div class="grid"><label>Raum<select id="openingRoom" class="field" required>${data.rooms.map(r=>`<option value="${esc(r.id)}" ${chosen?.roomId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><label>Element<select id="openingType" class="field"><option value="door" ${chosen?.type==='door'?'selected':''}>🚪 Tür</option><option value="window" ${chosen?.type==='window'?'selected':''}>▣ Fenster</option></select></label><label>Wand<select id="openingWall" class="field"><option value="top" ${chosen?.wall==='top'?'selected':''}>Oben</option><option value="right" ${chosen?.wall==='right'?'selected':''}>Rechts</option><option value="bottom" ${chosen?.wall==='bottom'?'selected':''}>Unten</option><option value="left" ${chosen?.wall==='left'?'selected':''}>Links</option></select></label><label>Position an der Wand <output id="openingPosValue">${chosen?.pos??50}%</output><input class="field" type="range" id="openingPos" min="12" max="88" value="${chosen?.pos??50}"></label></div><div class="actions"><button class="primary" type="submit">${chosen?'Änderungen speichern':'＋ Element hinzufügen'}</button>${chosen?'<button class="secondary" type="button" data-action="opening-new">＋ Weiteres</button><button class="danger" type="button" data-action="opening-delete">Element löschen</button>':''}</div></form></div>`}
  function floorplanHtml(){return `<div class="row"><h2>🗺️ Mein Wohnungsgrundriss</h2><button class="secondary" data-action="plan-edit">${planEditing?'✓ Fertig':'✏️ Bearbeiten'}</button></div><p class="floor-help">${planEditing?'Räume verschieben und an der Ecke skalieren. Türen und Fenster an einer Wand entlangziehen oder unten genau einstellen.':'Tippe auf einen Raum, um ihn zu öffnen. Mit „Bearbeiten“ platzierst du Räume, Türen und Fenster.'}</p><div class="floorplan ${planEditing?'editing':''}" id="floorplan" aria-label="Zeichnung der Wohnung">${data.rooms.map((r,i)=>{const b=getFloor(r,i),x=Math.min(95,Math.max(0,Number(b.x))),y=Math.min(95,Math.max(0,Number(b.y))),w=Math.min(100-x,Math.max(8,Number(b.w))),h=Math.min(100-y,Math.max(8,Number(b.h)));return `<div role="button" tabindex="0" class="floor-room ${selectedFloor===r.id?'selected':''}" data-floor-room="${esc(r.id)}" style="--room:${r.color};left:${x}%;top:${y}%;width:${w}%;height:${h}%"><span>${esc(r.name)}</span><small>${r.tasks.filter(t=>!t.done).length} offen</small>${(extra.openings||[]).filter(o=>o.roomId===r.id).map(openingHtml).join('')}${planEditing?'<span class="floor-handle" data-resize="true" aria-label="Raum vergrößern">↘</span>':''}</div>`}).join('')}</div>${openingEditorHtml()}<div class="floor-tools">${planEditing?'<button class="secondary" data-action="plan-reset">↺ Raumanordnung zurücksetzen</button><button class="secondary" data-nav="rooms">＋ Räume verwalten</button>':'<button class="secondary" data-nav="rooms">Räume verwalten →</button>'}</div><p class="muted">Schematischer Plan ohne Maßstab. Türen und Fenster werden den Raumwänden zugeordnet und in der Sicherung gespeichert.</p>`}

function overview(){const tt=tasks(),done=tt.filter(t=>t.done).length,open=tt.filter(t=>!t.done),stock=extra.stock||[],low=stock.filter(x=>Number(x.qty)<=Number(x.min)),buy=(extra.shopping||[]).filter(x=>!x.done),photoRooms=data.rooms.filter(r=>{let p=extra.photos[r.id]||{};return p.before||p.after}),pct=tt.length?Math.round(done/tt.length*100):0;
return `<div class="box"><div class="row"><div><h2>🏠 Gesamte Wohnungsübersicht</h2><p class="muted">Alles Wichtige aus deiner Wohnung an einem Ort.</p></div><span class="pill">${data.rooms.length} Räume</span></div><div class="overview-grid"><div class="metric">✅ Erledigt<strong>${done} / ${tt.length}</strong><span class="muted">${pct}% der Aufgaben</span></div><div class="metric">📋 Noch offen<strong>${open.length}</strong><span class="muted">Aufgaben in der Wohnung</span></div><div class="metric">📦 Lagerartikel<strong>${stock.length}</strong><span class="muted">${low.length} knapp oder leer</span></div><div class="metric">🛒 Einkaufsliste<strong>${buy.length}</strong><span class="muted">Noch einzukaufen</span></div></div>${progress(done,tt.length)}<button class="secondary" data-nav="today">Tagesaufgaben öffnen →</button></div>
<div class="box">${floorplanHtml()}</div>
<div class="box"><div class="row"><h2>📋 Was ist noch zu erledigen?</h2><span class="pill">${open.length} offen</span></div>${open.slice(0,8).map(taskHtml).join('')||'<div class="empty">Keine offenen Aufgaben.</div>'}${open.length>8?`<p class="muted">Weitere ${open.length-8} Aufgaben in den jeweiligen Räumen.</p>`:''}<button class="secondary" data-nav="rooms">Alle Räume öffnen →</button></div>
<div class="box"><div class="row"><h2>📦 Lager & Einkäufe</h2><button class="secondary" data-nav="stock">Lager öffnen →</button></div>${stock.length?stock.slice(0,6).map(x=>`<div class="item-row"><span>🧴</span><div class="fill"><b>${esc(x.name)}</b><div class="muted">${esc(x.brand||'')} · ${Number(x.qty)||0} ${esc(x.unit||'Stück')} vorhanden</div></div><span class="pill">${Number(x.qty)<=Number(x.min)?'Nachkaufen':'Vorrätig'}</span></div>`).join(''):'<p class="muted">Noch keine Produkte erfasst. Lege dein Putzmittellager an.</p>'}<p class="muted">${buy.length} offene Einkaufseinträge</p><button class="secondary" data-nav="shopping">Einkaufsliste öffnen →</button></div>
<div class="box"><div class="row"><h2>📸 Vorher & Nachher</h2><button class="secondary" data-nav="photos">Alle Fotos →</button></div>${photoRooms.length?`<div class="grid">${photoRooms.map(r=>{let p=extra.photos[r.id];return `<button class="room" style="--room:${r.color};min-height:0" data-photo-open="${esc(r.id)}"><b>${esc(r.name)}</b><div class="photo-grid" style="margin-top:8px">${['before','after'].map(k=>p[k]?`<img class="dash-photo" src="${p[k]}" alt="${k==='before'?'Vorher':'Nachher'}">`:`<div class="placeholder small">${k==='before'?'Vorher':'Nachher'} fehlt</div>`).join('')}</div></button>`}).join('')}</div>`:'<p class="muted">Noch keine Vorher-Nachher-Fotos vorhanden. Du kannst in jedem Raum Bilder aufnehmen.</p>'}</div>
<div class="box"><h2>⏰ Erinnerungen</h2><p class="muted">Echte Handy-Erinnerungen sind in dieser Browser-Version noch nicht verfügbar. So entsteht kein falscher Eindruck, dass du bei geschlossener App benachrichtigt wirst.</p><button class="secondary" data-nav="reminders">Erinnerungen ansehen →</button></div>`}
function today(){const t=tasks(),d=t.filter(x=>x.done).length,up=t.filter(x=>!x.done).slice(0,3);return `<div class="box"><h2>🌤️ Dein heutiger Überblick</h2><div class="row"><span>${d} von ${t.length} Aufgaben erledigt</span><b>${t.length?Math.round(100*d/t.length):0}%</b></div>${progress(d,t.length)}<p class="muted">Du musst nicht alles heute schaffen. Kleine Schritte zählen.</p></div><div class="box"><div class="row"><h2>Die nächsten 3 Aufgaben</h2><span class="pill">Einfach anfangen</span></div>${up.length?up.map(taskHtml).join(''):'<div class="empty">Alles abgehakt. Du kannst neue Aufgaben hinzufügen.</div>'}</div><div class="box"><h2>⚡ 10-Minuten-Modus</h2><p class="muted">Beginne mit der ersten offenen Aufgabe. Falls sie zu groß ist, erledige nur einen kleinen Teil davon.</p><button class="primary" data-nav="rooms">Räume ansehen →</button></div>`}
function rooms(){return `<div class="box"><div class="row"><h2>🏠 Meine Räume</h2><button class="primary" data-action="newroom">＋ Raum</button></div><p class="muted">Jeder Raum besitzt eine eigene Farbe, Aufgaben und eine Fotoseite.</p><div class="grid">${data.rooms.map(r=>`<button class="room" data-room="${esc(r.id)}" style="--room:${r.color}"><span class="ball"></span><h3>${esc(r.name)}</h3><span class="small">${r.tasks.filter(t=>t.done).length} / ${r.tasks.length} Aufgaben</span>${progress(r.tasks.filter(t=>t.done).length,r.tasks.length,r.color)}</button>`).join('')}</div></div>`}
function detail(){const r=data.rooms.find(r=>r.id===roomId);if(!r)return rooms();const sub=[['tasks','☑ Aufgaben'],['photos','📷 Fotos'],['guides','📖 Anleitungen']];return `<div class="box"><button class="secondary" data-nav="rooms">← Alle Räume</button><div class="room-head" style="--room:${r.color};margin-top:18px"><h2>${esc(r.name)}</h2><div class="muted">${r.tasks.filter(t=>t.done).length} von ${r.tasks.length} Aufgaben erledigt</div>${progress(r.tasks.filter(t=>t.done).length,r.tasks.length,r.color)}</div><label class="muted">Raumfarbe ändern <input type="color" id="changeColor" value="${r.color}" style="vertical-align:middle;margin:12px"></label><div class="subtabs">${sub.map(([id,label])=>`<button class="${roomTab===id?'active':''}" data-roomtab="${id}">${label}</button>`).join('')}</div>${roomTab==='tasks'?`<div class="box"><h2>Aufgaben in ${esc(r.name)}</h2>${r.tasks.map(t=>taskHtml({...t,roomId:r.id})).join('')||'<p class="muted">Noch keine Aufgaben eingetragen.</p>'}<form id="taskForm" class="actions" style="margin-top:14px"><input id="taskName" class="field" style="flex:1;min-width:160px;margin:0" maxlength="110" required placeholder="Neue Aufgabe"><button class="primary">＋ Hinzufügen</button></form></div><div class="box"><button class="danger" data-action="delroom">Raum löschen</button></div>`:roomTab==='photos'?photoContent(r):guidesContent(r)}`}
const LIB=[{name:'WC reinigen',room:'WC',tools:'WC-Reiniger, WC-Bürste, geeignete Handschuhe, separate Tücher',steps:['Fenster öffnen oder ausreichend lüften. Handschuhe anziehen.','WC-Reiniger gemäß Etikett in die Schüssel geben und vorgeschriebene Einwirkzeit beachten.','Außenflächen, Spülknopf und Sitz mit geeignetem Reiniger und separatem Tuch reinigen.','Mit der WC-Bürste die Schüssel reinigen und spülen.','Arbeitsmaterial reinigen, Handschuhe ausziehen, Hände waschen.'],warning:'Nie chlorhaltige Reiniger mit sauren WC-Reinigern oder anderen Mitteln mischen.'},{name:'Waschbecken reinigen',room:'Bad',tools:'Materialgeeigneter Badreiniger, weiches Tuch, Handschuhe',steps:['Gegenstände beiseitestellen.','Armaturen und Becken mit einem geeigneten Reiniger nach Etikett bearbeiten.','Mit klarem Wasser nachwischen, sofern vorgeschrieben.','Mit sauberem Tuch trockenreiben.'],warning:'Bei Naturstein, empfindlichen Oberflächen und beschichteten Armaturen keine ungeeigneten sauren oder scheuernden Reiniger verwenden.'},{name:'Kühlschrank reinigen',room:'Küche',tools:'Weiche Tücher, mildes Spülmittel, lauwarmes Wasser',steps:['Empfindliche Lebensmittel kühl zwischenlagern.','Lebensmittel ausräumen, Haltbarkeit prüfen und Einlegeböden entnehmen.','Innenflächen, Dichtungen und herausnehmbare Teile mit geeigneter milder Lösung reinigen.','Mit sauberem, feuchtem Tuch nachwischen und gut trocknen.','Lebensmittel geordnet wieder einräumen.'],warning:'Keine aggressiven Scheuermittel benutzen. Herstellerhinweise zum Reinigen beachten.'},{name:'Backofen reinigen',room:'Küche',tools:'Weiches Tuch, geeigneter Backofenreiniger, Handschuhe',steps:['Ofen vollständig abkühlen lassen und Gebrauchsanleitung lesen.','Lose Krümel entfernen.','Geeigneten Reiniger nach Produktvorgaben auf zugelassene Flächen auftragen.','Einwirken lassen und Rückstände entsprechend Anleitung entfernen.','Mit sauberem Tuch nacharbeiten und trocknen lassen.'],warning:'Reinigungsmittel nicht auf Heizelemente, Dichtungen oder empfindliche Beschichtungen auftragen, wenn nicht ausdrücklich erlaubt.'},{name:'Waschmaschine pflegen',room:'Bad',tools:'Weiches Tuch, Wasser, ggf. vom Hersteller empfohlenes Pflegemittel',steps:['Türdichtung vorsichtig auf Fremdkörper prüfen und abwischen.','Waschmittelschublade gemäß Anleitung herausnehmen und reinigen.','Flusensieb nur gemäß Geräteanleitung und nach Absicherung gegen auslaufendes Wasser reinigen.','Bei Bedarf Maschinenpflegeprogramm laut Hersteller durchführen.','Tür und Schublade danach zum Trocknen geöffnet lassen, sofern sicher.'],warning:'Herstellervorgaben beachten; keine unterschiedlichen Reiniger mischen.'},{name:'Geschirrspüler pflegen',room:'Küche',tools:'Weiches Tuch, Wasser, eventuell Maschinenpfleger',steps:['Sieb gemäß Anleitung entnehmen und reinigen.','Türdichtungen und erreichbare Ränder abwischen.','Sprüharme nach Herstellervorgabe prüfen.','Bei Bedarf Pflegeprogramm mit zugelassenem Mittel laufen lassen.'],warning:'Keine Handspülmittel in die Maschine geben.'},{name:'Kaffeemaschine reinigen',room:'Küche',tools:'Herstellergeeigneter Entkalker/Reiniger, Tuch',steps:['Gerätemodell und Reinigungsanleitung prüfen.','Abnehmbare Teile wie vorgesehen reinigen.','Reinigungs- bzw. Entkalkungsprogramm mit zugelassenem Mittel starten.','Spülgänge nach Geräteanweisung durchführen.'],warning:'Entkalkung und Reinigungsprogramme unterscheiden sich stark je nach Modell. Herstelleranleitung hat Vorrang.'},{name:'Boden reinigen',room:'Allgemein',tools:'Staubsauger/Besen, geeigneter Bodenreiniger, Mopp',steps:['Lose Gegenstände wegräumen.','Staub und Krümel saugen oder fegen.','Passenden Reiniger für den Bodenbelag auswählen und sparsam dosieren.','Von hinten zum Ausgang wischen und Boden trocknen lassen.'],warning:'Holz, Laminat und Naturstein können empfindlich gegen Wasser oder Reiniger sein.'}];
function guideMarkup(g){return `<details class="guide"><summary>${esc(g.name)}</summary><p class="muted"><b>Du brauchst:</b> ${esc(g.tools)}</p><ol>${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="tip"><b>Wichtig:</b> ${esc(g.warning)}</div></details>`}function guidesContent(r){const gs=LIB.filter(x=>x.room===r.name||x.room==='Allgemein');return `<div class="box"><h2>📖 Anleitung für ${esc(r.name)}</h2><p class="muted">Tippe eine Anleitung an, um alle Schritte zu sehen.</p>${gs.map(guideMarkup).join('')}<p class="muted">Weitere Anleitungen folgen. Geräte immer nach Herstelleranleitung reinigen.</p></div>`}function guidePage(){return `<div class="box"><h2>📖 Die Putzschule</h2><p class="muted">Praktische Anleitungen mit Materialliste, Arbeitsschritten und Sicherheitshinweisen.</p>${LIB.map(guideMarkup).join('')}</div>`}
function photoContent(r){const pics=extra.photos[r.id]||{};return `<div class="box"><h2>📸 Fotos – ${esc(r.name)}</h2><p class="muted">Wähle ein Foto vor und nach dem Aufräumen. Die Bilder werden verkleinert und lokal gespeichert.</p><div class="photo-grid">${['before','after'].map((type)=>`<div class="photo">${pics[type]?`<img src="${pics[type]}" alt="${type==='before'?'Vorher':'Nachher'} – ${esc(r.name)}">`:`<div class="placeholder">${icon('camera')}<b>${type==='before'?'Vorher':'Nachher'}</b><span class="small">Noch kein Foto</span></div>`}<label class="small" style="padding:8px;display:block">📷 ${type==='before'?'Vorher':'Nachher'} aufnehmen<input type="file" accept="image/*" capture="environment" data-photo="${type}" data-photo-room="${esc(r.id)}"></label></div>`).join('')}</div><p class="muted">Fotos können Speicherplatz benötigen. Sichere deine Daten regelmäßig.</p></div>`}function photos(){return `<div class="box"><h2>📷 Vorher & Nachher</h2><p class="muted">Wähle einen Raum, um Fotos aufzunehmen und zu vergleichen.</p><div class="stack">${data.rooms.map(r=>`<button class="secondary row" style="border-left:6px solid ${r.color};width:100%;text-align:left" data-photo-open="${esc(r.id)}"><b>${esc(r.name)}</b><span>Fotos öffnen →</span></button>`).join('')}</div></div>`}
function reminders(){return `<div class="box"><h2>⏰ Erinnerungen</h2><div class="tip"><b>Geplant für die Android-App:</b> Waschmaschine, Geschirrspüler und Putztage mit verlässlichen Handy-Benachrichtigungen – auch wenn die App geschlossen ist.</div><p class="muted">Diese HTML-Testversion enthält noch keine echten Systembenachrichtigungen. Wir vermeiden eine Schein-Erinnerung, die bei geschlossenem Browser ausbleibt.</p></div>`}function stock(){return `<div class="box"><h2>📦 Mein Putzmittellager</h2><p class="muted">Speichere deine Produkte, Mengen und Mindestbestände. Knappes wird in der Übersicht angezeigt.</p><form id="stockForm"><label>Produktname<input class="field" id="stockName" maxlength="90" required placeholder="z. B. Badreiniger"></label><div class="grid"><label>Marke<input class="field" id="stockBrand" maxlength="70" placeholder="Marke"></label><label>Einheit<select class="field" id="stockUnit"><option>Stück</option><option>Flaschen</option><option>Packungen</option><option>Liter</option></select></label><label>Bestand<input type="number" class="field" id="stockQty" min="0" step="1" value="1" required></label><label>Nachkaufen ab<input type="number" class="field" id="stockMin" min="0" step="1" value="0" required></label></div><button class="primary">＋ Produkt speichern</button></form></div><div class="box"><h2>Alle Produkte (${extra.stock.length})</h2>${extra.stock.map(x=>`<div class="item-row"><div class="fill"><b>${esc(x.name)}</b><div class="muted">${esc(x.brand||'Ohne Marke')} · ${Number(x.qty)} ${esc(x.unit)}</div><span class="pill">${Number(x.qty)<=Number(x.min)?'⚠ Nachkaufen':'✓ Vorrätig'}</span></div><div class="actions"><button class="secondary" data-stock-decrease="${esc(x.id)}" aria-label="Bestand reduzieren">−</button><button class="secondary" data-stock-increase="${esc(x.id)}" aria-label="Bestand erhöhen">＋</button><button class="secondary" data-stock-buy="${esc(x.id)}">🛒</button><button class="danger" data-stock-delete="${esc(x.id)}" aria-label="Produkt löschen">✕</button></div></div>`).join('')||'<div class="empty">Noch keine Produkte eingetragen.</div>'}</div>`}
function shopping(){const items=extra.shopping||[];return `<div class="box"><h2>🛒 Einkaufsliste</h2><form id="shoppingForm" class="actions"><input class="field" style="flex:1;min-width:160px;margin:0" id="shoppingName" maxlength="120" required placeholder="Was fehlt noch?"><button class="primary">＋ Hinzufügen</button></form><p class="muted">Du kannst fehlende Lagerartikel über das 🛒-Symbol übernehmen.</p></div><div class="box"><h2>Meine Einkaufseinträge (${items.filter(x=>!x.done).length} offen)</h2>${items.map(x=>`<div class="task ${x.done?'done':''}"><input type="checkbox" data-shop-toggle="${esc(x.id)}" ${x.done?'checked':''}><span class="label">${esc(x.name)}</span><button class="danger" data-shop-delete="${esc(x.id)}" aria-label="Eintrag löschen">✕</button></div>`).join('')||'<div class="empty">Einkaufsliste ist leer.</div>'}</div>`}
function settings(){return `<div class="box"><h2>🎨 Hintergrundfarbe auswählen</h2><p class="muted">Wähle eine helle Farbe. Die Raumfarben bleiben unabhängig davon erhalten.</p><div class="theme-swatches">${Object.entries(THEMES).map(([id,t])=>`<button type="button" class="theme-swatch ${extra.theme===id?'active':''}" data-theme="${id}" style="--swatch:${t.bg}">${t.name}</button>`).join('')}</div></div><div class="box"><h2>💾 Daten & Sicherung</h2><p class="muted">Alle Aufgaben und Raumfarben werden lokal in diesem Browser gespeichert. Fotos werden ebenfalls lokal gespeichert. Löschen der Browserdaten kann alles entfernen.</p><div class="actions"><button class="primary" data-action="export">Sicherung herunterladen</button><label class="secondary" style="cursor:pointer">Sicherung importieren<input type="file" id="importFile" accept="application/json,.json" hidden></label></div></div><div class="box"><h2>Aufgaben zurücksetzen</h2><p class="muted">Markiert alle Aufgaben wieder als offen, ohne sie zu löschen.</p><button class="secondary" data-action="reset">Alle Häkchen zurücksetzen</button></div>`}
function render(){nav();$('content').innerHTML=({overview,today,rooms,detail,guide:guidePage,photos,reminders,stock,shopping,settings}[page]||today)()}
function paintPalette(){$('palette').innerHTML=PALETTE.map(c=>`<button type="button" class="color-choice ${chosenColor===c?'selected':''}" style="background:${c}" data-color="${c}" aria-label="Farbe ${c}"></button>`).join('')}
document.addEventListener('click',e=>{let opening=e.target.closest('[data-opening]');if(opening){e.stopPropagation();if(planEditing&&!ignoreFloorClick){selectedOpening=opening.dataset.opening;render()}ignoreFloorClick=false;return}let sw=e.target.closest('[data-theme]');if(sw){extra.theme=sw.dataset.theme;applyTheme();persist();render();return}let fp=e.target.closest('[data-floor-room]');if(fp){if(ignoreFloorClick){ignoreFloorClick=false;return}if(planEditing){selectedFloor=fp.dataset.floorRoom;render()}else{roomTab='tasks';navigate('detail',fp.dataset.floorRoom)}return}let el=e.target.closest('[data-nav]');if(el){navigate(el.dataset.nav);return}el=e.target.closest('[data-room]');if(el){roomTab='tasks';navigate('detail',el.dataset.room);return}el=e.target.closest('[data-roomtab]');if(el){roomTab=el.dataset.roomtab;render();return}el=e.target.closest('[data-photo-open]');if(el){roomTab='photos';navigate('detail',el.dataset.photoOpen);return}el=e.target.closest('[data-color]');if(el){chosenColor=el.dataset.color;paintPalette();return}el=e.target.closest('[data-del-task]');if(el){const r=data.rooms.find(x=>x.id===roomId);if(r&&confirm('Diese Aufgabe wirklich löschen?')){r.tasks=r.tasks.filter(t=>t.id!==el.dataset.delTask);persist();render()}return}el=e.target.closest('[data-action]');if(!el)return;let action=el.dataset.action;if(action==='plan-edit'){planEditing=!planEditing;selectedFloor=null;selectedOpening=null;render();return}if(action==='opening-new'){selectedOpening=null;render();return}if(action==='opening-delete'){if(confirm('Tür oder Fenster entfernen?')){extra.openings=extra.openings.filter(o=>o.id!==selectedOpening);selectedOpening=null;persist();render()}return}if(action==='plan-reset'&&confirm('Raumpositionen und Größen zurücksetzen?')){extra.floorplan={};persist();render();return}if(action==='newroom'){paintPalette();$('roomDialog').showModal()}if(action==='delroom'&&confirm('Raum und alle zugehörigen Aufgaben und Fotos löschen?')){data.rooms=data.rooms.filter(r=>r.id!==roomId);delete extra.photos[roomId];delete extra.floorplan[roomId];extra.openings=extra.openings.filter(o=>o.roomId!==roomId);persist();navigate('rooms')}if(action==='reset'&&confirm('Alle Aufgaben wieder als offen markieren?')){data.rooms.forEach(r=>r.tasks.forEach(t=>t.done=false));persist();render()}if(action==='export'){let blob=new Blob([JSON.stringify({app:'mein-zuhause-v1-3',version:3,rooms:data.rooms,extra},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Mein_Zuhause_Sicherung_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-stock-decrease],[data-stock-increase],[data-stock-buy],[data-stock-delete],[data-shop-delete]');if(!el)return;const sid=el.dataset.stockDecrease||el.dataset.stockIncrease||el.dataset.stockBuy||el.dataset.stockDelete;const x=extra.stock.find(p=>p.id===sid);if(el.hasAttribute('data-stock-decrease')&&x)x.qty=Math.max(0,Number(x.qty)-1);if(el.hasAttribute('data-stock-increase')&&x)x.qty=Number(x.qty)+1;if(el.hasAttribute('data-stock-buy')&&x&&!extra.shopping.some(a=>!a.done&&a.name===x.name)){extra.shopping.push({id:uid(),name:x.name,done:false})}if(el.hasAttribute('data-stock-delete')&&confirm('Produkt löschen?'))extra.stock=extra.stock.filter(p=>p.id!==sid);if(el.hasAttribute('data-shop-delete'))extra.shopping=extra.shopping.filter(p=>p.id!==el.dataset.shopDelete);persist();render()});
document.addEventListener('input',e=>{if(e.target.id==='openingPos'){const out=$('openingPosValue');if(out)out.textContent=e.target.value+'%'}});document.addEventListener('change',async e=>{let x=e.target;if(x.matches('[data-shop-toggle]')){const item=extra.shopping.find(q=>q.id===x.dataset.shopToggle);if(item){item.done=x.checked;persist();render()}}if(x.matches('[data-task]')){let r=data.rooms.find(r=>r.id===x.dataset.owner),t=r?.tasks.find(t=>t.id===x.dataset.task);if(t){t.done=x.checked;persist();render()}}if(x.id==='changeColor'){const r=data.rooms.find(r=>r.id===roomId);if(r){r.color=x.value;persist();render()}}if(x.id==='importFile'){const file=x.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.rooms)||obj.rooms.length>200||!obj.rooms.every(r=>typeof r.id==='string'&&typeof r.name==='string'&&/^#[a-f0-9]{6}$/i.test(r.color)&&Array.isArray(r.tasks)&&r.tasks.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&typeof t.done==='boolean')))throw Error('Ungültig');if(confirm('Aktuelle Daten durch die Sicherung ersetzen?')){const oldData=data,oldExtra=extra;data={rooms:obj.rooms};extra=(obj.extra&&typeof obj.extra==='object')?obj.extra:{photos:{}};if(!extra.photos)extra.photos={};if(!Array.isArray(extra.stock))extra.stock=[];if(!Array.isArray(extra.shopping))extra.shopping=[];if(!extra.floorplan||typeof extra.floorplan!=='object')extra.floorplan={};if(!Array.isArray(extra.openings))extra.openings=[];if(!THEMES[extra.theme])extra.theme='rosa';applyTheme();if(!persist()){data=oldData;extra=oldExtra;persist();return}navigate('overview')}}catch(err){alert('Die Sicherung konnte nicht eingelesen werden.')}}if(x.matches('[data-photo]')){const file=x.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Bitte eine Bilddatei auswählen.');return}try{const encoded=await resize(file);const id=x.dataset.photoRoom,kind=x.dataset.photo;const original=extra.photos[id]||{};extra.photos[id]={...original,[kind]:encoded};if(!persist()){extra.photos[id]=original;alert('Bild konnte nicht gespeichert werden: Speicher voll.');return}render()}catch(err){alert('Bild konnte nicht verarbeitet werden.')}}});
function resize(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.68))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image failed'))};img.src=url})}
document.addEventListener('submit',e=>{if(e.target.id==='openingForm'){e.preventDefault();let roomId=$('openingRoom').value,type=$('openingType').value,wall=$('openingWall').value,pos=Number($('openingPos').value);if(!data.rooms.some(r=>r.id===roomId)||!['door','window'].includes(type)||!['top','right','bottom','left'].includes(wall))return;const item=extra.openings.find(o=>o.id===selectedOpening);if(item)Object.assign(item,{roomId,type,wall,pos});else extra.openings.push({id:uid(),roomId,type,wall,pos});selectedOpening=null;persist();render();return}if(e.target.id==='stockForm'){e.preventDefault();extra.stock.push({id:uid(),name:$('stockName').value.trim(),brand:$('stockBrand').value.trim(),unit:$('stockUnit').value,qty:Number($('stockQty').value),min:Number($('stockMin').value)});persist();render();return}if(e.target.id==='shoppingForm'){e.preventDefault();const name=$('shoppingName').value.trim();if(name){extra.shopping.push({id:uid(),name,done:false});persist();render()}return}if(e.target.id==='roomForm'){e.preventDefault();const name=$('roomName').value.trim();if(!name)return;data.rooms.push({id:uid(),name,color:chosenColor,tasks:[]});persist();$('roomDialog').close();e.target.reset();navigate('rooms')}if(e.target.id==='taskForm'){e.preventDefault();const name=$('taskName').value.trim(),r=data.rooms.find(x=>x.id===roomId);if(name&&r){r.tasks.push({id:uid(),name,done:false});persist();render()}}});

 document.addEventListener('pointermove',e=>{if(!drag||drag.pointer!==e.pointerId)return;e.preventDefault();const dx=(e.clientX-drag.sx)/drag.rect.width*100,dy=(e.clientY-drag.sy)/drag.rect.height*100;if(drag.mode==='opening'){const item=extra.openings.find(o=>o.id===drag.openingId);if(!item)return;const vertical=item.wall==='left'||item.wall==='right';item.pos=Math.round(Math.max(12,Math.min(88,Number(drag.initial.pos)+(vertical?dy:dx))));drag.element.style[vertical?'top':'left']=item.pos+'%';if(Math.abs(dx)+Math.abs(dy)>.5)drag.moved=true;return}const b=drag.initial;let result;if(drag.mode==='move'){result={...b,x:Math.max(0,Math.min(100-b.w,b.x+dx)),y:Math.max(0,Math.min(100-b.h,b.y+dy))}}else{result={...b,w:Math.max(9,Math.min(100-b.x,b.w+dx)),h:Math.max(9,Math.min(100-b.y,b.h+dy))}}if(Math.abs(dx)+Math.abs(dy)>.5)drag.moved=true;extra.floorplan[drag.id]=result;Object.assign(drag.element.style,{left:result.x+'%',top:result.y+'%',width:result.w+'%',height:result.h+'%'})});
