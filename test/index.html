/* V1.4: Pastell-Themen, Grundriss, Türen und Fenster */
:root{--app-bg:#fff1f6;--app-surface:#fffaff;--app-accent:#aa507b}
body{background:var(--app-bg)}.box{background:var(--app-surface)}.topbar{background:var(--app-surface)}
.tab.active{background:color-mix(in srgb,var(--app-accent) 13%,white);color:var(--app-accent)}
.primary{background:var(--app-accent);border-color:var(--app-accent)}
.floorplan{width:100%;aspect-ratio:1.08;position:relative;border:2px solid #afbdd0;border-radius:16px;overflow:hidden;background-color:#fbfcff;background-image:linear-gradient(#dfe6ef 1px,transparent 1px),linear-gradient(90deg,#dfe6ef 1px,transparent 1px);background-size:5% 5%;touch-action:none;user-select:none}
.floor-room{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px;border:3px solid var(--room);border-radius:6px;background:color-mix(in srgb,var(--room) 23%,white);color:#1d2d43;text-align:center;overflow:hidden;touch-action:none;font-size:clamp(10px,2.7vw,14px);font-weight:750}
.floor-room small{font-size:10px;font-weight:500}.floorplan.editing .floor-room{cursor:grab;box-shadow:0 2px 6px #243d5c30}.floorplan.editing .floor-room.selected{outline:3px solid #223f6d;outline-offset:1px;z-index:2}
.floor-handle{position:absolute;right:0;bottom:0;width:25px;height:25px;border-radius:8px 0 0 0;background:#263d5c;color:white;display:grid;place-items:center;cursor:nwse-resize;font-size:15px;touch-action:none}
.theme-swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.theme-swatch{border:2px solid #d9dfe8;background:var(--swatch);min-height:65px;border-radius:13px;padding:7px;font-weight:650;color:#28394d}.theme-swatch.active{border-color:#253d65;box-shadow:0 0 0 2px #96a8c6}
.floor-help{font-size:12px;color:#586d86;margin:9px 0}.floor-tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* Tür-/Fenstermarker entlang einer Raumwand */
.opening{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;box-sizing:border-box;border-radius:3px;overflow:visible}
.opening.door{background:#ffffff;border:2px solid #965a32;color:#744020}
.opening.window{background:#a6e5ff;border:2px solid #2478ac;color:#13567a}
.opening.horizontal{width:28%;height:11px;transform:translate(-50%,-50%)}
.opening.vertical{width:11px;height:28%;transform:translate(-50%,-50%)}
.opening .opening-symbol{font-size:11px;position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:white;border-radius:4px;padding:0 2px;pointer-events:none}
.opening.vertical .opening-symbol{left:14px;top:50%;transform:translateY(-50%)}
.opening.selected{outline:3px solid #222e54;outline-offset:2px}
.opening-editor{padding:13px;border-radius:12px;background:#f5f3fb;border:1px solid #ded5ec;margin:12px 0}
.opening-editor .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.opening-editor label{font-size:13px;font-weight:650}
.opening-editor .field{margin:5px 0 9px}
.opening-note{font-size:12px;color:#576d83}

.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.calendar-day{border:1px solid #d7ddeb;border-radius:7px;min-height:65px;padding:4px 3px;font-size:12px;overflow:hidden;background:#fff}.calendar-weekday{text-align:center;font-size:11px;font-weight:700;padding:7px 0}.calendar-empty{min-height:22px}.calendar-day.is-today{border:2px solid #a4477c;background:#fff3f9}.calendar-entry{font-size:10px;overflow-wrap:anywhere;line-height:1.2;padding:2px;background:#e9eefb;border-radius:4px;margin-top:3px}.calendar-entry.complete{text-decoration:line-through;opacity:.65}.calendar-heading{flex-wrap:wrap;justify-content:center}.calendar-heading h3{margin:0 5px;flex:1;min-width:130px;text-align:center}.calendar-heading button{padding:7px 9px}.guide label{display:block;margin:9px 0}

<script>
(()=>{'use strict';const KEY='mein-zuhause-test-v15-core';const EXTRA='mein-zuhause-test-v15-extra';const PALETTE=['#F59E0B','#3B82F6','#A855F7','#10B981','#EC4899','#EF4444','#06B6D4','#84CC16','#6366F1','#F97316'];const original=[{name:'Küche',tasks:['Müll entfernen','Arbeitsflächen freiräumen','Geschirr abwaschen oder einräumen','Arbeitsflächen reinigen']},{name:'Bad',tasks:['Gegenstände aufräumen','Waschbecken reinigen','Spiegel reinigen']},{name:'WC',tasks:['WC reinigen','Oberflächen abwischen','Boden reinigen']},{name:'Wohnzimmer',tasks:['Herumliegende Sachen wegräumen','Staub entfernen','Boden saugen']},{name:'Schlafzimmer',tasks:['Kleidung einsortieren','Wäsche sammeln','Boden saugen']}];let data,extra;try{data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('mein-zuhause-test-v14-core')||localStorage.getItem('mein-zuhause-test-v13-core')||'null')}catch{}if(!data||!Array.isArray(data.rooms)){data={rooms:original.map((r,i)=>({id:'r'+i,name:r.name,color:PALETTE[i],tasks:r.tasks.map((name,j)=>({id:'t'+i+'-'+j,name,done:false}))}))}}try{extra=JSON.parse(localStorage.getItem(EXTRA)||localStorage.getItem('mein-zuhause-test-v14-extra')||localStorage.getItem('mein-zuhause-test-v13-extra')||'null')}catch{}if(!extra||typeof extra!=='object')extra={};if(!extra.photos)extra.photos={};if(!extra.photoHistory||typeof extra.photoHistory!=='object')extra.photoHistory={};if(!Array.isArray(extra.stock))extra.stock=[];if(!Array.isArray(extra.shopping))extra.shopping=[];if(!extra.floorplan||typeof extra.floorplan!=='object')extra.floorplan={};if(!extra.theme)extra.theme='rosa';if(!Array.isArray(extra.openings))extra.openings=[];const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function nextRepeatDate(frequency,from){const d=new Date((from||todayISO())+'T12:00:00');if(frequency==='daily')d.setDate(d.getDate()+1);else if(frequency==='weekly')d.setDate(d.getDate()+7);else if(frequency==='monthly')d.setMonth(d.getMonth()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let planEditing=false,selectedFloor=null,ignoreFloorClick=false,selectedOpening=null;let page='overview',roomId=null,roomTab='tasks',chosenColor=PALETTE[5];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));for(const [rid,pic] of Object.entries(extra.photos)){if((pic?.before||pic?.after)&&!extra.photoHistory[rid]?.length)extra.photoHistory[rid]=[{id:uid(),date:todayISO(),note:'Ältere Fotos – Datum nicht bekannt',before:pic.before||null,after:pic.after||null}]};const tabs=[['overview','Übersicht','dashboard'],['today','Heute','check'],['rooms','Räume','home'],['guide','Putzschule','book'],['photos','Fotos','camera'],['reminders','Erinnerung','bell'],['calendar','Kalender','check'],['gloves','Hygiene','book'],['stock','Lager','package'],['shopping','Einkauf','cart'],['settings','Daten','gear']];function icon(name){return `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><use href="#i-${name}"></use></svg>`}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(EXTRA,JSON.stringify(extra));$('error').style.display='none';return true}catch(e){$('error').style.display='block';$('error').textContent='Speichern fehlgeschlagen! Erstelle eine Datensicherung oder prüfe den verfügbaren Browserspeicher.';return false}}function tasks(){return data.rooms.flatMap(r=>r.tasks.map(t=>({...t,room:r.name,roomId:r.id,color:r.color})))}function progress(n,d,color){return `<div class="progress"><span style="width:${d?Math.round(100*n/d):0}%;${color?'background:'+color:''}"></span></div>`}function navigate(to,id){page=to;if(id)roomId=id;render();window.scrollTo(0,0)}function nav(){ $('tabs').innerHTML=tabs.map(([id,name,ic])=>`<button data-nav="${id}" class="tab ${page===id||(page==='detail'&&id==='rooms')?'active':''}">${icon(ic)}<span>${name}</span></button>`).join('')}
function taskHtml(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" data-task="${esc(t.id)}" data-owner="${esc(t.roomId)}" aria-label="${esc(t.name)}" ${t.done?'checked':''}><span class="label">${esc(t.name)}${t.repeat&&t.repeat!=='none'?`<span class="muted" style="display:block">↻ ${repeatLabel(t.repeat)} · Nächster Termin: ${esc(t.nextDue||'offen')}</span>`:''}</span>${page==='today'?`<span class="pill" style="border-left:4px solid ${t.color}">${esc(t.room)}</span>`:''}${page==='detail'?`<button data-del-task="${esc(t.id)}" aria-label="Aufgabe löschen">✕</button>`:''}</div>`}function repeatLabel(v){return ({daily:'Täglich',weekly:'Wöchentlich',monthly:'Monatlich'})[v]||'Einmalig'}function refreshRepeats(){let changed=false;data.rooms.forEach(r=>r.tasks.forEach(t=>{if(t.repeat&&t.repeat!=='none'&&t.done&&t.nextDue&&t.nextDue<=todayISO()){t.done=false;changed=true}}));if(changed)persist()}

 const THEMES={rosa:{name:'Rosa',bg:'#fff1f6',surface:'#fffafd',accent:'#ac4e7c'},lavendel:{name:'Lavendel',bg:'#f4efff',surface:'#fcfaff',accent:'#7457ad'},mint:{name:'Mint',bg:'#ebfaf4',surface:'#fafffc',accent:'#237d69'},himmel:{name:'Hellblau',bg:'#eef7ff',surface:'#fcfeff',accent:'#316b9a'},creme:{name:'Creme',bg:'#fff9e9',surface:'#fffefa',accent:'#9b7440'},neutral:{name:'Hellgrau',bg:'#f4f7fb',surface:'#fff',accent:'#1c548e'}};
 function applyTheme(){const t=THEMES[extra.theme]||THEMES.rosa;document.documentElement.style.setProperty('--app-bg',t.bg);document.documentElement.style.setProperty('--app-surface',t.surface);document.documentElement.style.setProperty('--app-accent',t.accent);document.querySelector('meta[name="theme-color"]').content=t.bg}
 function getFloor(r,i){const stored=extra.floorplan[r.id];if(stored&&['x','y','w','h'].every(k=>Number.isFinite(Number(stored[k]))))return stored;return {x:4+(i%2)*48,y:4+Math.floor(i/2)*22,w:44,h:19}}
  function openingHtml(o){const vertical=o.wall==='left'||o.wall==='right';const position=Math.max(12,Math.min(88,Number(o.pos)||50));const style=o.wall==='top'?`left:${position}%;top:0`:o.wall==='bottom'?`left:${position}%;top:100%`:o.wall==='left'?`left:0;top:${position}%`:`left:100%;top:${position}%`;return `<span role="button" tabindex="0" aria-label="${o.type==='door'?'Tür':'Fenster'} bearbeiten" title="${o.type==='door'?'Tür':'Fenster'} · antippen" class="opening ${o.type} ${vertical?'vertical':'horizontal'} ${selectedOpening===o.id?'selected':''}" data-opening="${esc(o.id)}" style="${style}"><span class="opening-symbol">${o.type==='door'?'🚪':'▣'}</span></span>`}
  function openingEditorHtml(){if(!planEditing)return '';let chosen=extra.openings.find(o=>o.id===selectedOpening);return `<div class="opening-editor"><h3>🚪 Türen & Fenster einsetzen</h3><p class="opening-note">Raum, Element und Wand auswählen. Position auf der Wand einstellen. Du kannst ein eingefügtes Element antippen, bearbeiten und entlang seiner Wand ziehen.</p><form id="openingForm"><div class="grid"><label>Raum<select id="openingRoom" class="field" required>${data.rooms.map(r=>`<option value="${esc(r.id)}" ${chosen?.roomId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><label>Element<select id="openingType" class="field"><option value="door" ${chosen?.type==='door'?'selected':''}>🚪 Tür</option><option value="window" ${chosen?.type==='window'?'selected':''}>▣ Fenster</option></select></label><label>Wand<select id="openingWall" class="field"><option value="top" ${chosen?.wall==='top'?'selected':''}>Oben</option><option value="right" ${chosen?.wall==='right'?'selected':''}>Rechts</option><option value="bottom" ${chosen?.wall==='bottom'?'selected':''}>Unten</option><option value="left" ${chosen?.wall==='left'?'selected':''}>Links</option></select></label><label>Position an der Wand <output id="openingPosValue">${chosen?.pos??50}%</output><input class="field" type="range" id="openingPos" min="12" max="88" value="${chosen?.pos??50}"></label></div><div class="actions"><button class="primary" type="submit">${chosen?'Änderungen speichern':'＋ Element hinzufügen'}</button>${chosen?'<button class="secondary" type="button" data-action="opening-new">＋ Weiteres</button><button class="danger" type="button" data-action="opening-delete">Element löschen</button>':''}</div></form></div>`}
  function roomSymbol(name){const n=name.toLocaleLowerCase('de');return n.includes('bad')?'🛁':n.includes('wc')||n.includes('toilet')?'🚽':n.includes('küch')?'🍳':n.includes('schlaf')?'🛏️':n.includes('wohn')?'🛋️':n.includes('vorraum')||n.includes('flur')?'🚪':n.includes('büro')?'💻':'🏠'}function roomStats(r){const h=(extra.photoHistory[r.id]||[]);return {photos:h.length,open:r.tasks.filter(t=>!t.done).length,done:r.tasks.filter(t=>t.done).length}}function floorplanHtml(){return `<div class="row"><h2>🗺️ Mein Wohnungsgrundriss</h2><button class="secondary" data-action="plan-edit">${planEditing?'✓ Fertig':'✏️ Bearbeiten'}</button></div><p class="floor-help">${planEditing?'Räume verschieben und an der Ecke skalieren. Türen und Fenster an einer Wand entlangziehen oder unten genau einstellen.':'Tippe auf einen Raum, um ihn zu öffnen. Mit „Bearbeiten“ platzierst du Räume, Türen und Fenster.'}</p><div class="floorplan ${planEditing?'editing':''}" id="floorplan" aria-label="Zeichnung der Wohnung">${data.rooms.map((r,i)=>{const b=getFloor(r,i),x=Math.min(95,Math.max(0,Number(b.x))),y=Math.min(95,Math.max(0,Number(b.y))),w=Math.min(100-x,Math.max(8,Number(b.w))),h=Math.min(100-y,Math.max(8,Number(b.h)));return `<div role="button" tabindex="0" class="floor-room ${selectedFloor===r.id?'selected':''}" data-floor-room="${esc(r.id)}" style="--room:${r.color};left:${x}%;top:${y}%;width:${w}%;height:${h}%"><span class="floor-symbol" aria-hidden="true">${roomSymbol(r.name)}</span><span>${esc(r.name)}</span><small class="floor-status">${roomStats(r).open} offen · 📸 ${roomStats(r).photos}</small>${(extra.openings||[]).filter(o=>o.roomId===r.id).map(openingHtml).join('')}${planEditing?'<span class="floor-handle" data-resize="true" aria-label="Raum vergrößern">↘</span>':''}</div>`}).join('')}</div>${openingEditorHtml()}<div class="floor-tools">${planEditing?'<button class="secondary" data-action="plan-reset">↺ Raumanordnung zurücksetzen</button><button class="secondary" data-nav="rooms">＋ Räume verwalten</button>':'<button class="secondary" data-nav="rooms">Räume verwalten →</button>'}</div><p class="muted">Schematischer Plan ohne Maßstab. Türen und Fenster werden den Raumwänden zugeordnet und in der Sicherung gespeichert.</p>`}

function overview(){const tt=tasks(),done=tt.filter(t=>t.done).length,open=tt.filter(t=>!t.done),stock=extra.stock||[],low=stock.filter(x=>Number(x.qty)<=Number(x.min)),buy=(extra.shopping||[]).filter(x=>!x.done),photoRooms=data.rooms.filter(r=>{let p=extra.photos[r.id]||{};return p.before||p.after}),pct=tt.length?Math.round(done/tt.length*100):0;
return `<div class="box"><div class="row"><div><h2>🏠 Gesamte Wohnungsübersicht</h2><p class="muted">Alles Wichtige aus deiner Wohnung an einem Ort.</p></div><span class="pill">${data.rooms.length} Räume</span></div><div class="overview-grid"><div class="metric">✅ Erledigt<strong>${done} / ${tt.length}</strong><span class="muted">${pct}% der Aufgaben</span></div><div class="metric">📋 Noch offen<strong>${open.length}</strong><span class="muted">Aufgaben in der Wohnung</span></div><div class="metric">📦 Lagerartikel<strong>${stock.length}</strong><span class="muted">${low.length} knapp oder leer</span></div><div class="metric">🛒 Einkaufsliste<strong>${buy.length}</strong><span class="muted">Noch einzukaufen</span></div></div>${progress(done,tt.length)}<button class="secondary" data-nav="today">Tagesaufgaben öffnen →</button></div>
<div class="box">${floorplanHtml()}</div>
<div class="box"><div class="row"><h2>📋 Was ist noch zu erledigen?</h2><span class="pill">${open.length} offen</span></div>${open.slice(0,8).map(taskHtml).join('')||'<div class="empty">Keine offenen Aufgaben.</div>'}${open.length>8?`<p class="muted">Weitere ${open.length-8} Aufgaben in den jeweiligen Räumen.</p>`:''}<button class="secondary" data-nav="rooms">Alle Räume öffnen →</button></div>
<div class="box"><div class="row"><h2>📦 Lager & Einkäufe</h2><button class="secondary" data-nav="stock">Lager öffnen →</button></div>${stock.length?stock.slice(0,6).map(x=>`<div class="item-row"><span>🧴</span><div class="fill"><b>${esc(x.name)}</b><div class="muted">${esc(x.brand||'')} · ${Number(x.qty)||0} ${esc(x.unit||'Stück')} vorhanden</div></div><span class="pill">${Number(x.qty)<=Number(x.min)?'Nachkaufen':'Vorrätig'}</span></div>`).join(''):'<p class="muted">Noch keine Produkte erfasst. Lege dein Putzmittellager an.</p>'}<p class="muted">${buy.length} offene Einkaufseinträge</p><button class="secondary" data-nav="shopping">Einkaufsliste öffnen →</button></div>
<div class="box"><div class="row"><h2>📸 Vorher & Nachher</h2><button class="secondary" data-nav="photos">Alle Fotos →</button></div>${photoRooms.length?`<div class="grid">${photoRooms.map(r=>{let p=extra.photos[r.id];return `<button class="room" style="--room:${r.color};min-height:0" data-photo-open="${esc(r.id)}"><b>${esc(r.name)}</b><div class="photo-grid" style="margin-top:8px">${['before','after'].map(k=>p[k]?`<img class="dash-photo" src="${p[k]}" alt="${k==='before'?'Vorher':'Nachher'}">`:`<div class="placeholder small">${k==='before'?'Vorher':'Nachher'} fehlt</div>`).join('')}</div></button>`}).join('')}</div>`:'<p class="muted">Noch keine Vorher-Nachher-Fotos vorhanden. Du kannst in jedem Raum Bilder aufnehmen.</p>'}</div>
<div class="box"><h2>⏰ Erinnerungen</h2><p class="muted">Echte Handy-Erinnerungen sind in dieser Browser-Version noch nicht verfügbar. So entsteht kein falscher Eindruck, dass du bei geschlossener App benachrichtigt wirst.</p><button class="secondary" data-nav="reminders">Erinnerungen ansehen →</button></div>`}
function today(){const t=tasks(),d=t.filter(x=>x.done).length,up=t.filter(x=>!x.done).slice(0,3);return `<div class="box"><h2>🌤️ Dein heutiger Überblick</h2><div class="row"><span>${d} von ${t.length} Aufgaben erledigt</span><b>${t.length?Math.round(100*d/t.length):0}%</b></div>${progress(d,t.length)}<p class="muted">Du musst nicht alles heute schaffen. Kleine Schritte zählen.</p></div><div class="box"><div class="row"><h2>Die nächsten 3 Aufgaben</h2><span class="pill">Einfach anfangen</span></div>${up.length?up.map(taskHtml).join(''):'<div class="empty">Alles abgehakt. Du kannst neue Aufgaben hinzufügen.</div>'}</div><div class="box"><h2>⚡ 10-Minuten-Modus</h2><p class="muted">Beginne mit der ersten offenen Aufgabe. Falls sie zu groß ist, erledige nur einen kleinen Teil davon.</p><button class="primary" data-nav="rooms">Räume ansehen →</button></div>`}
function rooms(){return `<div class="box"><div class="row"><h2>🏠 Meine Räume</h2><button class="primary" data-action="newroom">＋ Raum</button></div><p class="muted">Jeder Raum besitzt eine eigene Farbe, Aufgaben und eine Fotoseite.</p><div class="grid">${data.rooms.map(r=>`<button class="room" data-room="${esc(r.id)}" style="--room:${r.color}"><span class="ball"></span><h3>${esc(r.name)}</h3><span class="small">${r.tasks.filter(t=>t.done).length} / ${r.tasks.length} Aufgaben</span>${progress(r.tasks.filter(t=>t.done).length,r.tasks.length,r.color)}</button>`).join('')}</div></div>`}
function detail(){const r=data.rooms.find(r=>r.id===roomId);if(!r)return rooms();const sub=[['tasks','☑ Aufgaben'],['photos','📷 Fotos'],['guides','📖 Anleitungen']];return `<div class="box"><button class="secondary" data-nav="rooms">← Alle Räume</button><div class="room-head" style="--room:${r.color};margin-top:18px"><h2>${roomSymbol(r.name)} ${esc(r.name)}</h2><div class="muted">${r.tasks.filter(t=>t.done).length} von ${r.tasks.length} Aufgaben erledigt</div>${progress(r.tasks.filter(t=>t.done).length,r.tasks.length,r.color)}</div><div class="room-insights"><div><b>📋 ${roomStats(r).open}</b><br>Offene Aufgaben</div><div><b>📸 ${roomStats(r).photos}</b><br>Foto-Termine</div></div><label class="muted">Raumfarbe ändern <input type="color" id="changeColor" value="${r.color}" style="vertical-align:middle;margin:12px"></label><div class="subtabs">${sub.map(([id,label])=>`<button class="${roomTab===id?'active':''}" data-roomtab="${id}">${label}</button>`).join('')}</div>${roomTab==='tasks'?`<div class="box"><h2>Aufgaben in ${esc(r.name)}</h2>${r.tasks.map(t=>taskHtml({...t,roomId:r.id})).join('')||'<p class="muted">Noch keine Aufgaben eingetragen.</p>'}<form id="taskForm" class="actions" style="margin-top:14px"><input id="taskName" class="field" style="flex:1;min-width:160px;margin:0" maxlength="110" required placeholder="Neue Aufgabe"><button class="primary">＋ Hinzufügen</button></form></div><div class="box"><button class="danger" data-action="delroom">Raum löschen</button></div>`:roomTab==='photos'?photoContent(r):guidesContent(r)}`}
const LIB=[{name:'WC reinigen',room:'WC',tools:'WC-Reiniger, WC-Bürste, geeignete Handschuhe, separate Tücher',steps:['Fenster öffnen oder ausreichend lüften. Handschuhe anziehen.','WC-Reiniger gemäß Etikett in die Schüssel geben und vorgeschriebene Einwirkzeit beachten.','Außenflächen, Spülknopf und Sitz mit geeignetem Reiniger und separatem Tuch reinigen.','Mit der WC-Bürste die Schüssel reinigen und spülen.','Arbeitsmaterial reinigen, Handschuhe ausziehen, Hände waschen.'],warning:'Nie chlorhaltige Reiniger mit sauren WC-Reinigern oder anderen Mitteln mischen.'},{name:'Waschbecken reinigen',room:'Bad',tools:'Materialgeeigneter Badreiniger, weiches Tuch, Handschuhe',steps:['Gegenstände beiseitestellen.','Armaturen und Becken mit einem geeigneten Reiniger nach Etikett bearbeiten.','Mit klarem Wasser nachwischen, sofern vorgeschrieben.','Mit sauberem Tuch trockenreiben.'],warning:'Bei Naturstein, empfindlichen Oberflächen und beschichteten Armaturen keine ungeeigneten sauren oder scheuernden Reiniger verwenden.'},{name:'Kühlschrank reinigen',room:'Küche',tools:'Weiche Tücher, mildes Spülmittel, lauwarmes Wasser',steps:['Empfindliche Lebensmittel kühl zwischenlagern.','Lebensmittel ausräumen, Haltbarkeit prüfen und Einlegeböden entnehmen.','Innenflächen, Dichtungen und herausnehmbare Teile mit geeigneter milder Lösung reinigen.','Mit sauberem, feuchtem Tuch nachwischen und gut trocknen.','Lebensmittel geordnet wieder einräumen.'],warning:'Keine aggressiven Scheuermittel benutzen. Herstellerhinweise zum Reinigen beachten.'},{name:'Backofen reinigen',room:'Küche',tools:'Weiches Tuch, geeigneter Backofenreiniger, Handschuhe',steps:['Ofen vollständig abkühlen lassen und Gebrauchsanleitung lesen.','Lose Krümel entfernen.','Geeigneten Reiniger nach Produktvorgaben auf zugelassene Flächen auftragen.','Einwirken lassen und Rückstände entsprechend Anleitung entfernen.','Mit sauberem Tuch nacharbeiten und trocknen lassen.'],warning:'Reinigungsmittel nicht auf Heizelemente, Dichtungen oder empfindliche Beschichtungen auftragen, wenn nicht ausdrücklich erlaubt.'},{name:'Waschmaschine pflegen',room:'Bad',tools:'Weiches Tuch, Wasser, ggf. vom Hersteller empfohlenes Pflegemittel',steps:['Türdichtung vorsichtig auf Fremdkörper prüfen und abwischen.','Waschmittelschublade gemäß Anleitung herausnehmen und reinigen.','Flusensieb nur gemäß Geräteanleitung und nach Absicherung gegen auslaufendes Wasser reinigen.','Bei Bedarf Maschinenpflegeprogramm laut Hersteller durchführen.','Tür und Schublade danach zum Trocknen geöffnet lassen, sofern sicher.'],warning:'Herstellervorgaben beachten; keine unterschiedlichen Reiniger mischen.'},{name:'Geschirrspüler pflegen',room:'Küche',tools:'Weiches Tuch, Wasser, eventuell Maschinenpfleger',steps:['Sieb gemäß Anleitung entnehmen und reinigen.','Türdichtungen und erreichbare Ränder abwischen.','Sprüharme nach Herstellervorgabe prüfen.','Bei Bedarf Pflegeprogramm mit zugelassenem Mittel laufen lassen.'],warning:'Keine Handspülmittel in die Maschine geben.'},{name:'Kaffeemaschine reinigen',room:'Küche',tools:'Herstellergeeigneter Entkalker/Reiniger, Tuch',steps:['Gerätemodell und Reinigungsanleitung prüfen.','Abnehmbare Teile wie vorgesehen reinigen.','Reinigungs- bzw. Entkalkungsprogramm mit zugelassenem Mittel starten.','Spülgänge nach Geräteanweisung durchführen.'],warning:'Entkalkung und Reinigungsprogramme unterscheiden sich stark je nach Modell. Herstelleranleitung hat Vorrang.'},{name:'Boden reinigen',room:'Allgemein',tools:'Staubsauger/Besen, geeigneter Bodenreiniger, Mopp',steps:['Lose Gegenstände wegräumen.','Staub und Krümel saugen oder fegen.','Passenden Reiniger für den Bodenbelag auswählen und sparsam dosieren.','Von hinten zum Ausgang wischen und Boden trocknen lassen.'],warning:'Holz, Laminat und Naturstein können empfindlich gegen Wasser oder Reiniger sein.'}];
function guideMarkup(g){return `<details class="guide"><summary>${esc(g.name)}</summary><p class="muted"><b>Du brauchst:</b> ${esc(g.tools)}</p><ol>${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="tip"><b>Wichtig:</b> ${esc(g.warning)}</div></details>`}function guidesContent(r){const gs=LIB.filter(x=>x.room===r.name||x.room==='Allgemein');return `<div class="box"><h2>📖 Anleitung für ${esc(r.name)}</h2><p class="muted">Tippe eine Anleitung an, um alle Schritte zu sehen.</p>${gs.map(guideMarkup).join('')}<p class="muted">Weitere Anleitungen folgen. Geräte immer nach Herstelleranleitung reinigen.</p></div>`}function guidePage(){return `<div class="box"><h2>📖 Die Putzschule</h2><p class="muted">Praktische Anleitungen mit Materialliste, Arbeitsschritten und Sicherheitshinweisen.</p>${LIB.map(guideMarkup).join('')}</div>`}
function photoContent(r){const history=extra.photoHistory[r.id]||[];return `<div class="box"><h2>📸 Fotoarchiv – ${esc(r.name)}</h2><p class="muted">Jede Reinigung erhält einen eigenen Eintrag mit Datum und Vorher-/Nachher-Fotos. Alte Einträge bleiben erhalten.</p><button class="primary" data-photo-new="${esc(r.id)}">＋ Neuen Reinigungstermin anlegen</button></div>${history.length?history.slice().reverse().map(entry=>`<div class="box"><div class="row"><div><b>📅 ${esc(entry.date||'Ohne Datum')}</b><p class="muted" style="margin:3px 0">${esc(entry.note||'Reinigung')}</p></div><button class="danger" data-photo-delete="${esc(entry.id)}" data-photo-room="${esc(r.id)}">Löschen</button></div><div class="photo-grid">${['before','after'].map(type=>`<div class="photo">${entry[type]?`<img src="${entry[type]}" alt="${type==='before'?'Vorher':'Nachher'} – ${esc(r.name)}">`:`<div class="placeholder">${icon('camera')}<span>${type==='before'?'Vorher':'Nachher'} fehlt</span></div>`}<label class="small" style="display:block;padding:8px">${type==='before'?'Vorher':'Nachher'} aufnehmen<input type="file" accept="image/*" capture="environment" data-history-photo="${type}" data-history-room="${esc(r.id)}" data-history-id="${esc(entry.id)}"></label></div>`).join('')}</div></div>`).join(''):'<div class="box empty">Noch keine Reinigungen dokumentiert.</div>'}<div class="box tip">💾 Die Fotos werden auf diesem Gerät gespeichert. Viele Bilder können den Browserspeicher füllen. Bitte regelmäßig eine Sicherung exportieren.</div>`}function photos(){return `<div class="box"><h2>📷 Vorher & Nachher</h2><p class="muted">Wähle einen Raum, um Fotos aufzunehmen und zu vergleichen.</p><div class="stack">${data.rooms.map(r=>`<button class="secondary row" style="border-left:6px solid ${r.color};width:100%;text-align:left" data-photo-open="${esc(r.id)}"><b>${esc(r.name)}</b><span>Fotos öffnen →</span></button>`).join('')}</div></div>`}
function reminders(){const recurring=tasks().filter(t=>t.repeat&&t.repeat!=='none');return `<div class="box"><h2>🔁 Wiederkehrende Aufgaben</h2><p class="muted">Alle automatischen Aufgaben an einer Stelle verwalten: abhaken, wieder öffnen, bearbeiten oder löschen. Bei Erreichen des nächsten Termins werden erledigte Aufgaben erneut offen.</p><form id="repeatForm"><label>Raum<select class="field" id="repeatRoom">${data.rooms.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select></label><label>Aufgabe<input class="field" id="repeatName" maxlength="110" placeholder="z. B. Waschbecken reinigen" required></label><label>Wiederholung<select class="field" id="repeatFreq"><option value="daily">Täglich</option><option value="weekly" selected>Wöchentlich</option><option value="monthly">Monatlich</option></select></label><button class="primary">＋ Wiederkehrende Aufgabe anlegen</button></form></div><div class="box"><h2>Alle wiederkehrenden Aufgaben (${recurring.length})</h2>${recurring.length?recurring.map(t=>`<div class="item-row"><input type="checkbox" data-task="${esc(t.id)}" data-owner="${esc(t.roomId)}" ${t.done?'checked':''} aria-label="${esc(t.name)}" style="width:22px;height:22px"><div class="fill"><b>${esc(t.name)}</b><div class="muted">${esc(t.room)} · ${repeatLabel(t.repeat)} · ${t.done?'Erledigt':'Offen'} · Termin: ${esc(t.nextDue||'heute')}</div></div><button class="secondary" data-repeat-edit="${esc(t.id)}" data-repeat-room="${esc(t.roomId)}">Bearbeiten</button><button class="danger" data-repeat-del="${esc(t.id)}" data-repeat-room="${esc(t.roomId)}">✕</button></div>`).join(''):'<div class="empty">Noch keine wiederkehrenden Aufgaben angelegt.</div>'}</div><div class="box"><h3>📲 Handy-Benachrichtigungen</h3><p class="muted">Echte Push-Benachrichtigungen bei geschlossener App sind noch nicht eingebaut (spätere Aufgabe 10). Die Wiederholungen werden beim Öffnen aktualisiert.</p></div>`}function stock(){return `<div class="box"><h2>📦 Mein Putzmittellager</h2><p class="muted">Produktbilder und Angaben werden nur in dieser Test-App gespeichert. Herstelleretikett und Sicherheitsdatenblatt haben immer Vorrang.</p><form id="stockForm"><label>Produktname<input class="field" id="stockName" maxlength="90" required placeholder="z. B. Badreiniger"></label><div class="grid"><label>Marke<input class="field" id="stockBrand" maxlength="70" placeholder="Marke"></label><label>Einheit<select class="field" id="stockUnit"><option>Stück</option><option>Flaschen</option><option>Packungen</option><option>Liter</option></select></label><label>Bestand<input type="number" class="field" id="stockQty" min="0" step="0.1" value="1" required></label><label>Nachkaufen ab<input type="number" class="field" id="stockMin" min="0" step="0.1" value="0" required></label></div><label>Zum Putzen von / Einsatzgebiet<textarea class="field" id="stockUse" maxlength="350" placeholder="Bad, WC, Fliesen ..."></textarea></label><div class="grid"><label>Gekauft bei<input class="field" id="stockStore" maxlength="100" placeholder="Drogerie oder Geschäft"></label><label>Preis in Euro (optional)<input type="number" class="field" id="stockPrice" min="0" max="100000" step="0.01" placeholder="0,00"></label></div><label>Handschuhe / Schutz<select class="field" id="stockGloves"><option value="Etikett prüfen">Etikett prüfen</option><option value="Ja, geeignete Schutzhandschuhe">Ja – geeignete Schutzhandschuhe</option><option value="Keine Angabe">Keine Angabe</option></select></label><label>Anwendung / Dosierung<textarea class="field" id="stockDirections" maxlength="600" placeholder="Nach Herstellerangaben ..."></textarea></label><label>Sicherheit / ungeeignete Oberflächen<textarea class="field" id="stockWarnings" maxlength="600" placeholder="Nicht mit anderen Reinigern mischen ..."></textarea></label><label>Produktfotografie (optional)<input class="field" type="file" id="stockPhoto" accept="image/*" capture="environment"></label><button class="primary" type="submit">＋ Produkt speichern</button></form></div><div class="box"><h2>Alle Produkte (${extra.stock.length})</h2>${extra.stock.map(x=>`<article class="stock-card"><div class="stock-card-top">${x.photo?`<img class="stock-img" src="${x.photo}" alt="Foto von ${esc(x.name)}">`:`<span class="stock-no-img">🧴</span>`}<div class="fill"><b>${esc(x.name)}</b><div class="muted">${esc(x.brand||'Ohne Marke')} · ${Number(x.qty)||0} ${esc(x.unit||'Stück')}</div><span class="pill">${Number(x.qty)<=Number(x.min)?'⚠ Nachkaufen':'✓ Vorrätig'}</span></div></div><details class="guide"><summary>ℹ️ Produktdetails anzeigen</summary><p><b>Einsatz:</b> ${esc(x.use||'Nicht erfasst')}</p><p><b>Einkaufsort:</b> ${esc(x.store||'Nicht erfasst')}${x.price!==null&&x.price!==undefined&&x.price!==''?' · '+Number(x.price).toFixed(2)+' €':''}</p><p><b>Handschuhe:</b> ${esc(x.gloves||'Etikett prüfen')}</p><p><b>Anwendung:</b> ${esc(x.directions||'Herstelleretikett beachten')}</p><p><b>Sicherheit:</b> ${esc(x.warnings||'Herstelleretikett und Materialverträglichkeit beachten')}</p></details><div class="actions"><button class="secondary" data-stock-edit="${esc(x.id)}">✏️ Bearbeiten</button><button class="secondary" data-stock-decrease="${esc(x.id)}" aria-label="Bestand reduzieren">−</button><button class="secondary" data-stock-increase="${esc(x.id)}" aria-label="Bestand erhöhen">＋</button><button class="secondary" data-stock-buy="${esc(x.id)}">🛒</button><button class="danger" data-stock-delete="${esc(x.id)}" aria-label="Produkt löschen">✕</button></div></article>`).join('')||'<div class="empty">Noch keine Produkte eingetragen.</div>'}</div>`}
function shopping(){const items=extra.shopping||[];return `<div class="box"><h2>🛒 Einkaufsliste</h2><form id="shoppingForm" class="actions"><input class="field" style="flex:1;min-width:160px;margin:0" id="shoppingName" maxlength="120" required placeholder="Was fehlt noch?"><button class="primary">＋ Hinzufügen</button></form><p class="muted">Du kannst fehlende Lagerartikel über das 🛒-Symbol übernehmen.</p></div><div class="box"><h2>Meine Einkaufseinträge (${items.filter(x=>!x.done).length} offen)</h2>${items.map(x=>`<div class="task ${x.done?'done':''}"><input type="checkbox" data-shop-toggle="${esc(x.id)}" ${x.done?'checked':''}><span class="label">${esc(x.name)}</span><button class="danger" data-shop-delete="${esc(x.id)}" aria-label="Eintrag löschen">✕</button></div>`).join('')||'<div class="empty">Einkaufsliste ist leer.</div>'}</div>`}

// V1.5 – Monatskalender mit optionalen, lokal gespeicherten Terminen.
let calendarOffset=0;
const calEsc=esc;
function calendarPage(){
  if(!Array.isArray(extra.calendarEvents))extra.calendarEvents=[];
  const now=new Date(),month=new Date(now.getFullYear(),now.getMonth()+calendarOffset,1);
  const yr=month.getFullYear(),mo=month.getMonth(),days=new Date(yr,mo+1,0).getDate(),offset=(month.getDay()+6)%7;
  const dayKey=d=>`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const all=tasks(),repeat=all.filter(t=>t.repeat&&t.repeat!=='none');
  const events=extra.calendarEvents.filter(t=>t.date?.startsWith(`${yr}-${String(mo+1).padStart(2,'0')}-`));
  const due=repeat.filter(t=>t.nextDue?.startsWith(`${yr}-${String(mo+1).padStart(2,'0')}-`));
  const names=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const cells=names.map(n=>`<div class="calendar-weekday">${n}</div>`);
  for(let i=0;i<offset;i++)cells.push('<div class="calendar-empty"></div>');
  for(let d=1;d<=days;d++){
    const date=dayKey(d),ev=events.filter(x=>x.date===date),rt=due.filter(t=>t.nextDue===date);
    cells.push(`<div class="calendar-day ${date===todayISO()?'is-today':''}"><b>${d}</b>${ev.slice(0,3).map(x=>`<div class="calendar-entry ${x.done?'complete':''}" title="${calEsc(x.name)}">${x.done?'✓':'•'} ${calEsc(x.name)}</div>`).join('')}${rt.slice(0,3).map(x=>`<div class="calendar-entry">↻ ${calEsc(x.name)}</div>`).join('')}${ev.length+rt.length>3?`<small>+${ev.length+rt.length-3}</small>`:''}</div>`);
  }
  const dateEntries=events.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="box"><h2>📅 Mein Putzkalender</h2><p class="muted">Deine geplanten Reinigungstermine und die nächsten Fälligkeiten wiederkehrender Aufgaben. Alles bleibt lokal in dieser Testversion.</p><div class="row calendar-heading"><button class="secondary" data-cal-offset="-1">◀</button><h3>${month.toLocaleDateString('de-AT',{month:'long',year:'numeric'})}</h3><button class="secondary" data-cal-offset="1">▶</button><button class="secondary" data-cal-today="1">Heute</button></div><div class="calendar-grid">${cells.join('')}</div><p class="muted">↻ = Nächster Termin einer wiederkehrenden Aufgabe. Vergangene Wiederholungen werden nicht rückwirkend als erledigt dokumentiert. Für echte Handy-Mitteilungen ist weiterhin Aufgabe 10 vorgesehen.</p></div>
  <div class="box"><h3>＋ Reinigungstermin eintragen</h3><form id="calendarForm"><label>Datum<input id="calDate" class="field" type="date" required value="${todayISO()}"></label><label>Raum<select class="field" id="calRoom">${data.rooms.map(r=>`<option value="${calEsc(r.id)}">${calEsc(r.name)}</option>`).join('')}</select></label><label>Was soll gemacht werden?<input class="field" id="calName" maxlength="120" required placeholder="z. B. Fenster reinigen"></label><button class="primary" type="submit">Termin speichern</button></form></div>
  <div class="box"><h3>Termine in diesem Monat (${dateEntries.length})</h3>${dateEntries.length?dateEntries.map(e=>`<div class="item-row"><input type="checkbox" data-cal-check="${calEsc(e.id)}" ${e.done?'checked':''} aria-label="Erledigt"><div class="fill"><b>${calEsc(e.name)}</b><div class="muted">${calEsc(e.date)} · ${calEsc(data.rooms.find(r=>r.id===e.roomId)?.name||'Raum entfernt')}</div></div><button class="danger" data-cal-delete="${calEsc(e.id)}">✕</button></div>`).join(''):'<p class="muted">Noch keine eigenen Termine in diesem Monat.</p>'}</div>`;
}
const GLOVE_GUIDES=[
 {title:'Handhygiene und Handschuhwechsel',body:['Hände vor dem Anziehen und nach dem Ausziehen waschen und sorgfältig trocknen.','Einmalhandschuhe nicht waschen oder mehrfach verwenden, außer der Hersteller erlaubt dies ausdrücklich.','Bei Wechsel zwischen WC und Küche Handschuhe wechseln; Kreuzkontamination vermeiden.','Beschädigte oder innen feuchte Handschuhe rechtzeitig wechseln.']},
 {title:'Welcher Handschuh für welches Mittel?',body:['Nitril, Latex, Vinyl und andere Materialien bieten keinen pauschalen Schutz gegen alle Chemikalien.','Sicherheitsdatenblatt Abschnitt 8, Herstellerangaben zu Material, Materialstärke und Durchbruchzeit beachten.','Einweghandschuhe können für konzentrierte Reiniger ungeeignet sein. Für längeren Kontakt gegebenenfalls geprüfte Chemikalienschutzhandschuhe verwenden.','Latex kann Allergien auslösen; bei Hautproblemen fachliche Beratung einholen.']},
 {title:'Etiketten und Gefahrensymbole',body:['Vor Anwendung immer Etikett, Gefahrenpiktogramme und Dosierangaben lesen.','Bei reizenden oder ätzenden Produkten geeigneten Augen-, Haut- und Handschutz verwenden.','Produkte niemals eigenmächtig mischen, besonders Chlorreiniger nicht mit Säuren oder Ammoniak.','Reiniger außerhalb der Reichweite von Kindern und in Originalbehältern lagern.']},
 {title:'Hygienische Putzreihenfolge',body:['Von saubereren zu stärker verschmutzten Bereichen arbeiten.','Oben beginnen und nach unten vorgehen; WC zuletzt und mit separaten Tüchern reinigen.','Für Küche, Bad und WC getrennte Reinigungstücher einsetzen.','Arbeitsmaterial nach Gebrauch gemäß Herstellerangaben reinigen und vollständig trocknen lassen.']},
 {title:'Hautschutz beim Putzen',body:['Handschuhe möglichst nur so lange tragen, wie es die Tätigkeit erfordert.','Bei längerem Arbeiten auf trockene Hände, passende Größe und geeignete Hautpflege achten.','Bei Brennen, Ausschlag oder Rissen Tätigkeit unterbrechen und Reinigungsmittel sowie Handschuhmaterial prüfen.','Bei anhaltenden Beschwerden ärztlichen oder arbeitsmedizinischen Rat einholen.']},
 {title:'Oberflächen und Desinfektion',body:['Im normalen Haushalt reicht häufig eine sachgerechte Reinigung mit materialgeeignetem Reiniger.','Desinfektionsmittel nur bei begründetem Bedarf und gemäß Etikett verwenden.','Einwirkzeiten und Oberflächenverträglichkeit beachten; Desinfektionsmittel nicht mischen.','Bei lebensmittelnahen Flächen vorgeschriebene Nachspülhinweise beachten.']},
];
function glovePage(){return `<div class="box"><h2>🧤 Hygiene- & Handschuhberater</h2><p class="muted">Praxiswissen für sichere Reinigungsarbeiten. Dieses Nachschlagewerk ersetzt weder das Etikett noch das Sicherheitsdatenblatt eines konkreten Produkts.</p><div class="tip"><b>Wichtig:</b> Nicht allein nach der Farbe oder dem Material der Handschuhe entscheiden. Schutzwirkung ist chemikalien- und produktspezifisch; Herstellerdaten prüfen.</div></div>${GLOVE_GUIDES.map(g=>`<div class="box"><details class="guide"><summary>${calEsc(g.title)}</summary><ol>${g.body.map(x=>`<li>${calEsc(x)}</li>`).join('')}</ol></details></div>`).join('')}<div class="box"><h3>Checkliste vor der Reinigung</h3><div class="guide"><label><input type="checkbox"> Produktetikett und Materialverträglichkeit geprüft</label><label><input type="checkbox"> Handschuhe passend zum Reiniger gewählt</label><label><input type="checkbox"> Lüftung und ggf. Augenschutz geklärt</label><label><input type="checkbox"> Separate Tücher für Hygienebereiche vorbereitet</label></div><p class="muted">Die Häkchen dienen nur zur momentanen Selbstkontrolle und werden nicht gespeichert.</p></div>`}
document.addEventListener('click',e=>{
 const shift=e.target.closest('[data-cal-offset]');if(shift){calendarOffset+=Number(shift.dataset.calOffset);render();return}
 if(e.target.closest('[data-cal-today]')){calendarOffset=0;render();return}
 const del=e.target.closest('[data-cal-delete]');if(del){if(!confirm('Reinigungstermin wirklich löschen?'))return;extra.calendarEvents=(extra.calendarEvents||[]).filter(x=>x.id!==del.dataset.calDelete);persist();render()}
});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-cal-check]');if(!el)return;const ev=(extra.calendarEvents||[]).find(x=>x.id===el.dataset.calCheck);if(ev){ev.done=el.checked;persist();render()}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='calendarForm')return;e.preventDefault();const name=$('calName').value.trim(),date=$('calDate').value,roomId=$('calRoom').value;
 if(!name||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
 if(!Array.isArray(extra.calendarEvents))extra.calendarEvents=[];
 extra.calendarEvents.push({id:uid(),date,roomId,name:name.slice(0,120),done:false});
 const dt=new Date(date+'T12:00:00');calendarOffset=(dt.getFullYear()-new Date().getFullYear())*12+(dt.getMonth()-new Date().getMonth());
 if(!persist()){extra.calendarEvents.pop();return}render()
});

function render(){refreshRepeats();nav();$('content').innerHTML=({overview,today,rooms,detail,guide:guidePage,photos,reminders,calendar:calendarPage,gloves:glovePage,stock,shopping,settings}[page]||today)()}
function paintPalette(){$('palette').innerHTML=PALETTE.map(c=>`<button type="button" class="color-choice ${chosenColor===c?'selected':''}" style="background:${c}" data-color="${c}" aria-label="Farbe ${c}"></button>`).join('')}
document.addEventListener('click',e=>{const add=e.target.closest('[data-photo-new]');if(add){const id=add.dataset.photoNew;const when=prompt('Datum der Reinigung (JJJJ-MM-TT)',todayISO());if(when===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(when)||Number.isNaN(new Date(when+'T12:00:00').getTime())){alert('Bitte ein gültiges Datum verwenden.');return}const note=prompt('Notiz (optional), z. B. Wochenputz','')||'';const list=extra.photoHistory[id]||(extra.photoHistory[id]=[]);list.push({id:uid(),date:when,note:note.slice(0,150),before:null,after:null});if(!persist()){list.pop();return}render();return}const drop=e.target.closest('[data-photo-delete]');if(drop){if(!confirm('Diesen Reinigungstermin und beide Bilder wirklich löschen?'))return;const id=drop.dataset.photoRoom,list=extra.photoHistory[id]||[],idx=list.findIndex(x=>x.id===drop.dataset.photoDelete);if(idx!==-1){const old=list.splice(idx,1)[0];if(!persist()){list.splice(idx,0,old);return}render()}return}const re=e.target.closest('[data-repeat-edit]');if(re){const r=data.rooms.find(x=>x.id===re.dataset.repeatRoom),t=r?.tasks.find(x=>x.id===re.dataset.repeatEdit);if(!t)return;let name=prompt('Aufgabenname',t.name);if(name===null)return;name=name.trim().slice(0,110);if(!name)return;const freq=prompt('Intervall: daily = täglich, weekly = wöchentlich, monthly = monatlich, none = einmalig',t.repeat||'weekly');if(freq===null)return;if(!['daily','weekly','monthly','none'].includes(freq)){alert('Ungültiges Intervall');return}t.name=name;t.repeat=freq;t.nextDue=freq==='none'?null:todayISO();t.done=false;persist();render();return}const rd=e.target.closest('[data-repeat-del]');if(rd){const r=data.rooms.find(x=>x.id===rd.dataset.repeatRoom);if(r&&confirm('Wiederkehrende Aufgabe löschen?')){r.tasks=r.tasks.filter(x=>x.id!==rd.dataset.repeatDel);persist();render()}return}let opening=e.target.closest('[data-opening]');if(opening){e.stopPropagation();if(planEditing&&!ignoreFloorClick){selectedOpening=opening.dataset.opening;render()}ignoreFloorClick=false;return}let sw=e.target.closest('[data-theme]');if(sw){extra.theme=sw.dataset.theme;applyTheme();persist();render();return}let fp=e.target.closest('[data-floor-room]');if(fp){if(ignoreFloorClick){ignoreFloorClick=false;return}if(planEditing){selectedFloor=fp.dataset.floorRoom;render()}else{roomTab='tasks';navigate('detail',fp.dataset.floorRoom)}return}let el=e.target.closest('[data-nav]');if(el){navigate(el.dataset.nav);return}el=e.target.closest('[data-room]');if(el){roomTab='tasks';navigate('detail',el.dataset.room);return}el=e.target.closest('[data-roomtab]');if(el){roomTab=el.dataset.roomtab;render();return}el=e.target.closest('[data-photo-open]');if(el){roomTab='photos';navigate('detail',el.dataset.photoOpen);return}el=e.target.closest('[data-color]');if(el){chosenColor=el.dataset.color;paintPalette();return}el=e.target.closest('[data-del-task]');if(el){const r=data.rooms.find(x=>x.id===roomId);if(r&&confirm('Diese Aufgabe wirklich löschen?')){r.tasks=r.tasks.filter(t=>t.id!==el.dataset.delTask);persist();render()}return}el=e.target.closest('[data-action]');if(!el)return;let action=el.dataset.action;if(action==='plan-edit'){planEditing=!planEditing;selectedFloor=null;selectedOpening=null;render();return}if(action==='opening-new'){selectedOpening=null;render();return}if(action==='opening-delete'){if(confirm('Tür oder Fenster entfernen?')){extra.openings=extra.openings.filter(o=>o.id!==selectedOpening);selectedOpening=null;persist();render()}return}if(action==='plan-reset'&&confirm('Raumpositionen und Größen zurücksetzen?')){extra.floorplan={};persist();render();return}if(action==='newroom'){paintPalette();$('roomDialog').showModal()}if(action==='delroom'&&confirm('Raum und alle zugehörigen Aufgaben und Fotos löschen?')){data.rooms=data.rooms.filter(r=>r.id!==roomId);delete extra.photos[roomId];delete extra.photoHistory[roomId];delete extra.floorplan[roomId];extra.openings=extra.openings.filter(o=>o.roomId!==roomId);persist();navigate('r
